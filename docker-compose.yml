# VisionGuard — Docker Compose
# Task 6.2
version: "3.9"

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://visionguard:visionguard@db:5432/visionguard
      - SECRET_KEY=${SECRET_KEY:-visionguard-prod-secret}
      - FLASK_ENV=production
    volumes:
      - upload_data:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=visionguard
      - POSTGRES_PASSWORD=visionguard
      - POSTGRES_DB=visionguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  upload_data:
